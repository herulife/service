<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Booking Service Laptop Tasikmalaya | Benua Komputer</title>
    <meta
      name="description"
      content="Form booking service laptop Tasikmalaya. Daftar antrian servis cepat & bergaransi dari Benua Komputer. WA 0821-1475-2228"
    />
    <meta name="geo.region" content="ID-JB" />
    <meta name="geo.placename" content="Tasikmalaya" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link href="css/bootstrap-icons.css" rel="stylesheet" />
    <link href="css/benua.css" rel="stylesheet" />
  </head>

  <body>
    <header class="site-header">
      <div class="container nav">
        <a class="brand" href="/" aria-label="Benua Komputer beranda">
          <span class="brand-mark">B</span>
          <span>Benua Komputer<small>Service Laptop Tasikmalaya</small></span>
        </a>
        <div class="nav-cta">
          <a class="wa-pill" href="https://api.whatsapp.com/send?phone=6282114752228&text=Salam%20Benua%20Komputer">
            <i class="bi bi-whatsapp"></i> 0821-1475-2228
          </a>
          <a class="btn btn--ghost" href="/">Beranda</a>
        </div>
      </div>
    </header>

    <main>
      <section class="section section--tight">
        <div class="container" style="max-width: 720px">
          <p class="eyebrow">Booking</p>
          <h1 style="margin-bottom: 10px">Daftar antrian service</h1>
          <p class="lead" style="margin-bottom: 28px">
            Isi form di bawah, kami akan hubungi Anda. Atau langsung chat WhatsApp untuk
            respons lebih cepat.
          </p>

          <form id="bookingForm" class="form-card" novalidate>
            <div class="field">
              <label for="name">Nama lengkap <span class="req">*</span></label>
              <input class="input" id="name" name="name" type="text" autocomplete="name" required />
            </div>
            <div class="field">
              <label for="wa">Nomor WhatsApp <span class="req">*</span></label>
              <input class="input" id="wa" name="wa" type="tel" inputmode="numeric" placeholder="08xxxx" required />
            </div>
            <div class="field">
              <label for="merk">Merk laptop</label>
              <input class="input" id="merk" name="merk" type="text" placeholder="Asus / Axioo / Lenovo / dll" />
            </div>
            <div class="field">
              <label for="kecamatan">Kecamatan / wilayah</label>
              <select class="select" id="kecamatan" name="kecamatan">
                <option value="">— Pilih —</option>
                <option>Cibeureum</option>
                <option>Singaparna</option>
                <option>Indihiang</option>
                <option>Mangkubumi</option>
                <option>Rajapolah</option>
                <option>Lainnya</option>
              </select>
            </div>
            <div class="field">
              <label for="kerusakan">Keluhan / kerusakan <span class="req">*</span></label>
              <textarea class="textarea" id="kerusakan" name="kerusakan" required></textarea>
            </div>
            <button type="submit" class="btn btn--primary btn--block" id="submitBtn">Kirim Booking</button>
            <div id="result" role="status" aria-live="polite" style="margin-top: 16px"></div>
          </form>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <div class="footer-note" style="border:0;margin-top:0">
          © 2026 Benua Komputer · Service Laptop Tasikmalaya
        </div>
      </div>
    </footer>

    <script>
      const form = document.getElementById("bookingForm");
      const result = document.getElementById("result");
      const btn = document.getElementById("submitBtn");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        result.innerHTML = "";
        if (!form.checkValidity()) {
          result.innerHTML =
            '<div class="banner banner--error">Mohon lengkapi field yang wajib diisi.</div>';
          form.reportValidity();
          return;
        }
        const data = Object.fromEntries(new FormData(form).entries());
        btn.disabled = true;
        btn.textContent = "Mengirim…";
        result.innerHTML =
          '<div class="banner banner--loading"><span class="spinner"></span>Mengirim booking…</div>';

        try {
          const res = await fetch("/api/booking", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data),
          });
          const out = await res.json();
          if (out.ok) {
            result.innerHTML =
              '<div class="banner banner--success">Booking terkirim! Lanjut ke WhatsApp untuk konfirmasi.<br><a class="btn btn--primary" style="margin-top:12px" href="' +
              out.waLink +
              '">Chat WhatsApp Admin</a></div>';
            form.reset();
          } else {
            result.innerHTML =
              '<div class="banner banner--error">' +
              (out.error || "Gagal mengirim. Coba lagi atau chat WA.") +
              "</div>";
          }
        } catch (err) {
          result.innerHTML =
            '<div class="banner banner--error">Terjadi gangguan jaringan. Silakan coba lagi atau hubungi WA kami.</div>';
        } finally {
          btn.disabled = false;
          btn.textContent = "Kirim Booking";
        }
      });
    </script>
  </body>
</html>
